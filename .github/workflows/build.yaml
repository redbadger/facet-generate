name: ci

on:
  push:
    branches:
      - main
  pull_request:
  # Lets a build be re-run by hand from the Actions tab or `gh workflow run ci
  # --ref main`. Without this there is no supported way to ask for a fresh run
  # on main: `push` only fires on a new commit, so a run that never starts
  # leaves main with no build and nothing to retry. That happened after #117 —
  # the run sat queued for 12 hours having acquired no jobs, and GitHub refused
  # both `rerun` ("already running") and `cancel` ("has not yet queued"), so it
  # could only be waited out.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: short
  NEXTEST_PROFILE: ci
  CI: 1
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A backstop, not a target: the job takes well under ten minutes. Without
    # it a wedged test inherits GitHub's six-hour default, which is how #126
    # once sat burning a Windows runner for six hours before being cancelled
    # by hand.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Check (fmt + clippy)
        run: just check

      - name: Docs
        run: just docs

      - name: Build
        run: just build

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('src/generation/csharp/installer/mod.rs') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Setup Additional Languages for codegen tests (deno — TypeScript test runner)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Additional Languages for codegen tests (swift)
        uses: SwiftyLab/setup-swift@latest

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Test
        run: just test

      - name: Swift runtime tests
        if: runner.os != 'Windows'
        run: just swift-test

      # The Kotlin tests leave a Gradle daemon running, and on Windows it keeps
      # `~/.gradle/caches/**/*.lock` open. `setup-java`'s post step tars that
      # directory to save the cache, tar fails to read the locked files
      # ("Device or resource busy") and exits 2, so the save is abandoned —
      # which is why every Windows run reported "gradle cache is not found" and
      # re-downloaded the whole Kotlin toolchain, taking 318s over Linux's 25s.
      # Stopping the daemon releases the locks so the cache can actually be
      # written.
      - name: Stop the Gradle daemon so its caches can be saved
        if: always()
        continue-on-error: true
        run: gradle --stop

name: ci

on:
  push:
    branches:
      - main
  pull_request:
  # Lets a build be re-run by hand from the Actions tab or `gh workflow run ci
  # --ref main`. Without this there is no supported way to ask for a fresh run
  # on main: `push` only fires on a new commit, so a run that never starts
  # leaves main with no build and nothing to retry. That happened after #117 —
  # the run sat queued for 12 hours having acquired no jobs, and GitHub refused
  # both `rerun` ("already running") and `cancel` ("has not yet queued"), so it
  # could only be waited out.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: short
  NEXTEST_PROFILE: ci
  CI: 1
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A backstop, not a target: the job takes well under ten minutes. Without
    # it a wedged test inherits GitHub's six-hour default, which is how #126
    # once sat burning a Windows runner for six hours before being cancelled
    # by hand.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Check (fmt + clippy)
        run: just check

      - name: Docs
        run: just docs

      - name: Build
        run: just build

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      # The path is relative to the workspace root, where there is no `src/` —
      # the old glob matched nothing, `hashFiles` returned the empty string, and
      # the key was a constant `<os>-nuget-` that could never invalidate.
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('crates/facet_generate/src/generation/csharp/installer/mod.rs') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      # Not `setup-java`'s own `cache: gradle`. Its key is a hash of Gradle
      # files that effectively never change here, and `actions/cache` will not
      # re-save over an exact key hit — so the first snapshot ever written is
      # the one every later run restores, permanently. The 95MB Windows cache
      # it left behind was saved while `compileKotlin` was still NO-SOURCE, so
      # it holds no compiler jars at all, and nothing would ever replace it.
      #
      # Instead: restore on every run, and write a fresh entry on each push to
      # `main`, where the Linux job does compile Kotlin and so populates the
      # full compiler classpath. Keying the save on `run_id` guarantees a miss
      # and therefore a write; `restore-keys` picks the most recent entry.
      # Confining writes to `main` keeps this from filling the 10GB repository
      # cache and evicting sccache.
      #
      # Windows is excluded because it no longer runs Gradle at all.
      - name: Restore the Gradle cache
        if: runner.os != 'Windows'
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('crates/facet_generate/src/generation/kotlin/installer/mod.rs') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ hashFiles('crates/facet_generate/src/generation/kotlin/installer/mod.rs') }}-
            ${{ runner.os }}-gradle-

      - name: Setup Additional Languages for codegen tests (deno — TypeScript test runner)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Additional Languages for codegen tests (swift)
        uses: SwiftyLab/setup-swift@latest

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Test
        run: just test

      - name: Swift runtime tests
        if: runner.os != 'Windows'
        run: just swift-test

      # The Kotlin tests leave a Gradle daemon running, which holds
      # `~/.gradle/caches/**/*.lock` open. This is what broke the save on
      # Windows before that job stopped running Gradle at all: tar could not
      # read the locked files ("Device or resource busy") and exited 2, so no
      # cache was ever written and every run re-downloaded the whole Kotlin
      # toolchain. Linux tolerates reading open files, but stopping the daemon
      # before the save is still the correct order.
      - name: Stop the Gradle daemon so its caches can be saved
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        continue-on-error: true
        run: gradle --stop

      - name: Save the Gradle cache
        if: ${{ !cancelled() && runner.os != 'Windows' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('crates/facet_generate/src/generation/kotlin/installer/mod.rs') }}-${{ github.run_id }}
